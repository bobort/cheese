<div class="mb-4" id="comments-section">
    <h5>Comments</h5>
    <div id="comments-list">
        {% for comment in comments %}
        <div class="card mb-2">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <strong>{{ comment.author.get_full_name() if comment.author else "Unknown" }}</strong>
                    <small class="text-muted">{{ comment.created_at|date("M d, Y H:i") }}</small>
                </div>
                <p class="mb-0 mt-2">{{ comment.comment }}</p>
            </div>
        </div>
        {% empty %}
        <p class="text-muted">No comments yet.</p>
        {% endfor %}
    </div>
    
    <!-- Add Comment Form (HTMX) -->
    <div id="comment-form-container" class="mt-3">
        <form hx-post="{{ url('staff:proposal-add-comment', pk=proposal.pk) }}"
              hx-target="#comments-section"
              hx-swap="outerHTML">
            {{ csrf_input }}
            <div class="form-group">
                {{ comment_form.comment }}
            </div>
            <div class="form-check mb-2">
                {{ comment_form.is_internal }}
                <label class="form-check-label" for="{{ comment_form.is_internal.id_for_label }}">
                    Internal Note (not visible to student)
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Add Comment</button>
        </form>
    </div>
</div>
